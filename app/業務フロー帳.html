<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>業務フロー帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
/* Palette: 藍 (indigo). Layout: drafting-table app — flow list | swimlane sheet | definition panel. Lanes read like a 業務フロー帳票 grid. */
:root{
  --paper:#F4F5F8; --surface:#FFFFFF; --ink:#1A2233; --muted:#5D6578; --line:#D6DAE3; --line-strong:#B1B8C8;
  --lane-a:#EDF0F6; --lane-b:#F8F9FC; --lane-head:#DFE4EE;
  --accent:#2C4F8E; --accent-ink:#FFFFFF; --accent-soft:#DCE4F3;
  --dec:#FBF1D6; --dec-line:#A9780F; --sel:#1F6FEB;
  --data:#E3F2EA; --data-line:#2C7647;
  --warn:#A8620C; --bad:#B2352A; --good:#2C7647; --info:#3F6E8C;
  --shadow:0 1px 2px rgb(26 34 51 / .06),0 4px 14px rgb(26 34 51 / .06);
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141C; --surface:#171D28; --ink:#E2E6EE; --muted:#939BAE; --line:#283041; --line-strong:#3C465C;
  --lane-a:#151B26; --lane-b:#121721; --lane-head:#1D2433;
  --accent:#8AA8E0; --accent-ink:#0D1526; --accent-soft:#1F2C47;
  --dec:#322A17; --dec-line:#D8A74A; --sel:#5C9DFF;
  --data:#16291F; --data-line:#6FC48D;
  --warn:#E2A24A; --bad:#EE7A69; --good:#6FC48D; --info:#7FB2D3;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 4px 14px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10141C; --surface:#171D28; --ink:#E2E6EE; --muted:#939BAE; --line:#283041; --line-strong:#3C465C;
  --lane-a:#151B26; --lane-b:#121721; --lane-head:#1D2433;
  --accent:#8AA8E0; --accent-ink:#0D1526; --accent-soft:#1F2C47;
  --dec:#322A17; --dec-line:#D8A74A; --sel:#5C9DFF;
  --data:#16291F; --data-line:#6FC48D;
  --warn:#E2A24A; --bad:#EE7A69; --good:#6FC48D; --info:#7FB2D3;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 4px 14px rgb(0 0 0 / .25); color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand-mark{width:22px;height:22px;flex:none}
.side-foot .ver{margin:2px 0 0;font-size:10.5px;color:var(--muted);opacity:.8}
.flow-title{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px}
.flow-title input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;font-weight:600;font-size:15px}
.flow-title input:hover{border-color:var(--line)}
.flow-title input:focus{border-color:var(--accent);background:var(--paper);outline:none}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.saved{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.dirty,.pill.saving{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.error{color:var(--bad);border-color:var(--bad)}
.bar-actions{display:flex;gap:6px;flex-wrap:wrap;position:relative}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{padding:2px 8px;font-size:12px}
.icon-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:7px;width:34px;height:32px;align-items:center;justify-content:center}

.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:290px;display:grid;gap:2px}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;display:grid;gap:1px}
.menu button:hover{background:var(--accent-soft)}
.menu small{color:var(--muted);font-size:11.5px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#folderBtn span{max-width:180px;overflow:hidden;text-overflow:ellipsis}

.body{--side-w:232px;--panel-w:420px;position:relative;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--panel-w);min-height:0;min-width:0}
.splitter{position:absolute;top:0;bottom:0;width:9px;margin-left:-4px;z-index:5;cursor:col-resize;touch-action:none}
.splitter::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:3px;background:transparent;transition:background .15s}
.splitter:hover::after,.splitter:focus-visible::after,.splitter.drag::after{background:var(--accent)}
.splitter:focus-visible{outline:none}
#splitSide{left:var(--side-w)}
#splitPanel{left:calc(100% - var(--panel-w))}
body.resizing{cursor:col-resize;user-select:none}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.side-head{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.flow-list{list-style:none;margin:0;padding:0 8px 8px;overflow:auto;flex:1}
.flow-list button{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;display:grid;gap:1px}
.flow-list button:hover{background:var(--lane-a)}
.flow-list button[aria-current="true"]{background:var(--accent-soft)}
.flow-list .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-list .fm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:6px}
.side-foot .eyebrow{margin-bottom:2px}
.side-foot button{justify-content:flex-start}
.store-note{font-size:11.5px;color:var(--muted);line-height:1.5}
.store-note.warn{color:var(--warn);font-weight:500}

.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
/* 以前のデータの移行や、ほかのアプリでの変更を知らせる帯 */
.notice{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--dec);border-bottom:1px solid var(--line);font-size:13px}
.notice span{flex:1 1 280px}
.stage-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-right:auto}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:22px;height:14px}
.legend .sep{width:1px;height:14px;background:var(--line);align-self:center}
.legend svg.wide{width:28px}
.zoom{display:flex;align-items:center;gap:2px}
.zoom output{font-size:12px;width:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.canvas{flex:1;overflow:auto;min-height:0;padding:20px 16px;background:
  radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/16px 16px,var(--paper)}
.canvas{cursor:grab}
.canvas.panning{cursor:grabbing;user-select:none}
.canvas .diagram{display:flex;width:max-content;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;box-shadow:var(--shadow)}
.canvas .diagram svg{display:block;flex:none}
.canvas .diagram svg.lanes{position:sticky;left:0;z-index:2}
.canvas svg .node{cursor:pointer}
.canvas svg .node:hover .shape{stroke:var(--accent);stroke-width:2}
.canvas svg .node:focus{outline:none}
.canvas svg .node:focus-visible .shape{stroke:var(--sel);stroke-width:2.5}
/* マウスを乗せた・キーボードで選んだステップや矢印：出入りする矢印と条件ラベルを、選択時より薄めに強調する */
.canvas svg path.edge.hv:not(.hot){stroke:var(--sel);stroke-opacity:.6;stroke-width:2;marker-end:url(#arrH)}
.canvas svg .elabel.hv rect{stroke:var(--sel)}
.canvas .diagram{user-select:none;-webkit-user-select:none}
/* 図の上での編集：＋ハンドル・矢印の当たり判定・ドラッグ中の表示・その場の入力欄 */
.canvas svg .handle{cursor:crosshair;touch-action:none}
.canvas svg .handle circle{fill:var(--surface);stroke:var(--sel);stroke-width:1.6}
.canvas svg .handle path{stroke:var(--sel);stroke-width:1.8;stroke-linecap:round}
.canvas svg .handle:hover circle,.canvas svg .handle:focus-visible circle{fill:var(--sel)}
.canvas svg .handle:hover path,.canvas svg .handle:focus-visible path{stroke:var(--surface)}
.canvas svg .handle:focus{outline:none}
.canvas svg .ehit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.canvas svg .ehandle{fill:var(--surface);stroke:var(--sel);stroke-width:2;cursor:move;touch-action:none}
.canvas svg .ehandle:hover{fill:var(--sel)}
.canvas svg .side-mark{fill:var(--sel);stroke:var(--surface);stroke-width:2;pointer-events:none}
.canvas.reattaching .ehit,.canvas.reattaching .elabel,.canvas.reattaching .ehandle{pointer-events:none}
.canvas.reattaching .sel-edge{opacity:.25}
.canvas svg .node.link-target .shape{stroke:var(--sel);stroke-width:3}
.canvas svg .node.dragging{pointer-events:none}
.canvas svg .lane-hi{fill:var(--sel);fill-opacity:.1;stroke:var(--sel);stroke-width:2;pointer-events:none}
.canvas svg .link-temp{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.canvas svg .drop-ghost{fill:var(--surface);fill-opacity:.75;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:5 4;pointer-events:none}
.canvas.dragging,.canvas.dragging *{cursor:grabbing!important}
.canvas.linking,.canvas.linking *{cursor:crosshair!important}
.step-tip{position:fixed;z-index:25;max-width:300px;min-width:160px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);padding:8px 11px;font-size:12.5px;line-height:1.6;pointer-events:none;display:grid;gap:7px}
.step-tip .tt-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.step-tip .tt-h svg{width:14px;height:14px;flex:none}
.step-tip .tt-b{white-space:pre-wrap;overflow-wrap:anywhere}
.step-tip .tt-issue .tt-h{color:var(--bad)}
.step-tip .tt-sec+.tt-sec{border-top:1px dashed var(--line);padding-top:7px}
.inline-edit{position:fixed;z-index:30;height:32px;border:2px solid var(--sel);border-radius:6px;background:var(--surface);padding:3px 8px;font-size:13px;box-shadow:var(--shadow);outline:none}
.inline-edit.cut{border-color:var(--warn)}
.canvas-hint{flex-basis:100%;margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.canvas-hint kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line-strong);border-radius:3px;padding:0 3px;background:var(--surface)}

.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;border-bottom:2px solid transparent;font-weight:500;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-size:11px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--lane-head);color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.count.bad{background:var(--bad);color:var(--surface)}
.count.warn{background:var(--warn);color:var(--surface)}
.tabpanel{flex:1;overflow:auto;padding:16px;min-height:0}

.sec{display:grid;gap:10px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-head h3{margin:0;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em}
.field{display:grid;gap:3px}
.field label,.lbl{font-size:11.5px;color:var(--muted);font-weight:500}
.inp{width:100%;min-width:0;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:5px 8px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:54px}
.row{display:flex;gap:6px;align-items:center}
.row>.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.lane-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.lane-row .ctrl{display:flex;gap:2px}
.lane-row .lane-id{flex:none;width:96px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lane-row .lane-id:focus{color:var(--ink)}
.mini{border:1px solid transparent;background:transparent;border-radius:5px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.mini:hover{border-color:var(--line);color:var(--ink)}
.mini:disabled{opacity:.3;cursor:default}
.lane-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;margin-bottom:14px;border-radius:8px;background:var(--lane-a)}
.lane-sum .lane-names{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--lane-a);border-radius:4px;padding:0 5px}

.step{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.step-sum{width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border-radius:8px}
.step-sum:hover{background:var(--lane-b)}
.step-sum{grid-template-columns:auto auto minmax(0,1fr) auto}
.grip{color:var(--line-strong);font-size:12px;letter-spacing:-2px;cursor:grab;padding:0 2px;user-select:none}
.step-sum:hover .grip{color:var(--muted)}
.step.dragging{opacity:.45}
.step.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.step.drop-after{box-shadow:0 3px 0 0 var(--accent)}
.step-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step-tools .help{margin-right:auto}
.step-sum .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-sum .ln{font-size:11.5px;color:var(--muted);white-space:nowrap}
.step.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step-body{padding:4px 10px 12px;display:grid;gap:10px}
.ticon{width:22px;height:16px;flex:none}
.inp.cut{border-color:var(--warn)}
.next-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.step-actions{display:flex;gap:6px;flex-wrap:wrap}
.flag{width:7px;height:7px;border-radius:50%;display:inline-block}
.flag.bad{background:var(--bad)} .flag.warn{background:var(--warn)}
/* 課題のしるし（チェックの丸い警告と見分けられるよう、角丸の四角に「!」） */
.imark{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:3px;background:var(--bad);color:var(--surface);font-size:10px;font-weight:700;line-height:1;vertical-align:1px}
textarea.inp.issue-inp{border-left:3px solid var(--bad)}

.yaml-wrap{display:grid;gap:8px;height:100%;grid-template-rows:auto minmax(0,1fr) auto}
.yaml{width:100%;height:100%;min-height:320px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;border:1px solid var(--line-strong);border-radius:6px;padding:10px 12px;background:var(--lane-b);resize:none;tab-size:2;white-space:pre;overflow:auto}
.yaml:focus{outline:none;border-color:var(--accent)}
.yaml-msg{font-size:12.5px;padding:6px 10px;border-radius:6px;background:var(--lane-a)}
.yaml-msg.err{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.help{font-size:12.5px;color:var(--muted)}
.help code,.mono{font-family:var(--f-mono);font-size:12px}

.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-left:3px solid var(--info);border-radius:6px;padding:8px 10px;background:var(--surface);text-align:left;width:100%}
.issue.bad{border-left-color:var(--bad)} .issue.warn{border-left-color:var(--warn)}
.issue .lv{font-size:11px;font-weight:600;letter-spacing:.06em;padding-top:2px}
.issue.bad .lv{color:var(--bad)} .issue.warn .lv{color:var(--warn)} .issue.info .lv{color:var(--info)}
.ok-box{border:1px solid color-mix(in srgb,var(--good) 40%,transparent);color:var(--good);border-radius:8px;padding:12px;font-weight:500}

.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.hist .t{font-variant-numeric:tabular-nums;font-weight:500}
.hist .d{font-size:11.5px;color:var(--muted)}

.empty{margin:auto;max-width:460px;text-align:center;display:grid;gap:12px;padding:32px 16px}
.empty h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}
.empty .row{justify-content:center;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:13px;z-index:50;box-shadow:var(--shadow)}
.scrim{display:none}

@media (max-width:1180px){
  .body{grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:minmax(0,1.1fr) minmax(0,1fr)}
  #splitPanel{display:none}
  .side{grid-row:1 / span 2}
  .panel{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .icon-btn{display:inline-flex}
  .body{display:flex;flex-direction:column}
  .splitter{display:none}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,85vw);z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:39}
  .canvas{height:58vh;min-height:300px;flex:none}
  .tabpanel{overflow:visible}
  .yaml{height:60vh}
}
/* 図だけを表示するモード：フロー一覧と編集エリアを隠す（狭い画面のフロー一覧は引き出しなので残す） */

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPES = { start:"開始", task:"作業", decision:"判断", system:"システム", document:"帳票", data:"データ", end:"終了" };
const LS_KEY = "flowbook.flows.v1", LS_CUR = "flowbook.current";
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
// 作業フォルダの参照（中身は含まない）だけを IndexedDB に置く。使えない環境では何もしない
function idb(mode, fn){
  return new Promise(res => {
    try {
      const rq = indexedDB.open("flowbook", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("handles");
      rq.onerror = () => res(null);
      rq.onsuccess = () => {
        const d = rq.result;
        try { const tx = d.transaction("handles", mode), r = fn(tx.objectStore("handles")); tx.oncomplete = () => { d.close(); res(r.result ?? null); }; tx.onerror = tx.onabort = () => { d.close(); res(null); }; }
        catch { d.close(); res(null); }
      };
    } catch { res(null); }
  });
}
const idbGet = k => idb("readonly", s => s.get(k));
const idbSet = (k, v) => idb("readwrite", s => s.put(v, k));

/* ---------- templates ---------- */
const TEMPLATES = {
  blank: `name: 新しい業務フロー
owner: ""
lanes:
  - id: lane1
    name: 担当者
  - id: lane2
    name: 承認者
steps:
  - id: s1
    type: start
    lane: lane1
    label: 依頼を受ける
    next: s2
  - id: s2
    type: task
    lane: lane1
    label: 作業を行う
    next: s3
  - id: s3
    type: end
    lane: lane2
    label: 完了
`,
  expense: `# 経費精算フロー（ひな形）
name: 経費精算フロー
owner: 経理部
description: 立替経費の申請から振込までの標準手順
lanes:
  - id: applicant
    name: 申請者
  - id: manager
    name: 上長
  - id: accounting
    name: 経理
  - id: erp
    name: 会計システム
steps:
  - id: s1
    type: start
    lane: applicant
    label: 経費が発生
    next: s2
  - id: s2
    type: task
    lane: applicant
    label: 精算申請を作成
    note: 領収書の画像を添付する
    next: s3
  - id: s3
    type: decision
    lane: manager
    label: 申請内容は妥当か
    next:
      - to: s4
        when: 承認
      - to: s2
        when: 差戻し
  - id: s4
    type: task
    lane: accounting
    label: 領収書と金額を照合
    issue: 紙の領収書を目視で照合しており、月末に作業が集中する
    next: s5
  - id: s5
    type: decision
    lane: accounting
    label: 経費規程に適合するか
    next:
      - to: s6
        when: 適合
      - to: s2
        when: 不備あり
  - id: s6
    type: system
    lane: erp
    label: 仕訳を登録
    next: s7
  - id: s7
    type: document
    lane: accounting
    label: 振込データを作成
    note: 毎月25日締め・翌月10日払い
    next: s8
  - id: s8
    type: end
    lane: applicant
    label: 指定口座へ入金
`,
  order: `# 受注〜出荷・請求フロー（ひな形）
name: 受注〜出荷・請求フロー
owner: 営業管理部
lanes:
  - id: customer
    name: 顧客
  - id: sales
    name: 営業
  - id: warehouse
    name: 倉庫

steps:
  - id: c1
    type: start

    lane: sales

    next:
      - to: c5
        when: 入荷後
  - id: c5
    type: system
    lane: sales
    label: 受注を登録
    next: c6
  - id: c6

    next: c7
  - id: c7

    label: ピッキング・梱包・出荷

/* ---------- model ---------- */
/* 矢印がステップのどの辺から出る（exit）・入る（entry）か。省くと自動。内部では T/B/L/R で持つ */
const SIDES = { top: "T", bottom: "B", left: "L", right: "R" };
const SIDE_NAME = { T: "上", B: "下", L: "左", R: "右" };
const sideIn = v => { const t = String(v ?? "").trim(); return SIDES[t.toLowerCase()] || ({ 上: "T", 下: "B", 左: "L", 右: "R" })[t] || (/^[TBLR]$/.test(t) ? t : ""); };
const sideOut = c => Object.keys(SIDES).find(k => SIDES[k] === c);
function normNext(n){
  if (n == null || n === "") return [];
  if (!Array.isArray(n)) n = [n];
  return n.map(x => {
    if (!x || typeof x !== "object") return { to: String(x), when: "" };
    const e = { to: String(x.to ?? ""), when: x.when != null ? String(x.when) : "" }, ex = sideIn(x.exit), en = sideIn(x.entry);
    if (ex) e.exit = ex;
    if (en) e.entry = en;
    return e;
  }).filter(e => e.to);
}
function normalize(raw){
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("先頭は name: / lanes: / steps: を持つ形にしてください。");
  const f = { name: String(raw.name ?? "無題のフロー"), owner: raw.owner != null ? String(raw.owner) : "", description: raw.description != null ? String(raw.description) : "", lanes: [], steps: [] };
  const lanes = raw.lanes ?? [], steps = raw.steps ?? [];
  if (!Array.isArray(lanes)) throw new Error("lanes は「- id: … / name: …」の並びで書いてください。");
  if (!Array.isArray(steps)) throw new Error("steps は「- id: …」の並びで書いてください。");
  lanes.forEach((l, i) => {
    if (typeof l === "string") f.lanes.push({ id: l, name: l });
    else if (l && typeof l === "object") f.lanes.push({ id: String(l.id ?? ("lane" + (i + 1))), name: String(l.name ?? l.id ?? ("担当" + (i + 1))) });
  });
  steps.forEach((s, i) => {
    if (!s || typeof s !== "object") return;
    const st = { id: String(s.id ?? ("s" + (i + 1))), type: TYPES[s.type] ? s.type : "task", lane: String(s.lane ?? ""), label: String(s.label ?? ""), note: s.note != null ? String(s.note) : "", issue: s.issue != null ? String(s.issue) : "", next: normNext(s.next) };
    // col: 図で左から何列目に置くか（1 始まり）。省くと自動で決める
    if (Number.isInteger(+s.col) && +s.col >= 1) st.col = +s.col;
    f.steps.push(st);
  });
  return f;
}
function toPlain(f){
  const o = { name: f.name };
  if (f.owner) o.owner = f.owner;
  if (f.description) o.description = f.description;
  o.lanes = f.lanes.map(l => ({ id: l.id, name: l.name }));
  o.steps = f.steps.map(s => {
    const r = { id: s.id, type: s.type, lane: s.lane };
    if (s.col) r.col = s.col;
    r.label = s.label;
    if (s.note) r.note = s.note;
    if (s.issue) r.issue = s.issue;
    if (s.next.length){
      if (s.next.every(e => !e.when && !e.exit && !e.entry)) r.next = s.next.length === 1 ? s.next[0].to : s.next.map(e => e.to);
      else r.next = s.next.map(e => {
        const o = { to: e.to };
        if (e.when) o.when = e.when;
        if (e.exit) o.exit = sideOut(e.exit);
        if (e.entry) o.entry = sideOut(e.entry);
        return o;
      });
    }
    return r;
  });
  return o;
}
const toYaml = f => jsyaml.dump(toPlain(f), { lineWidth: -1, noRefs: true });
function parseYaml(text){ return normalize(jsyaml.load(text)); }

function uid(prefix, taken){ let n = 1; while (taken.has(prefix + n)) n++; return prefix + n; }

/* ---------- validation ---------- */
function validate(f){
  const out = [], push = (level, msg, step) => out.push({ level, msg, step });
  const ids = new Map(); f.steps.forEach(s => ids.set(s.id, (ids.get(s.id) || 0) + 1));
  const laneIds = new Map(); f.lanes.forEach(l => laneIds.set(l.id, (laneIds.get(l.id) || 0) + 1));
  laneIds.forEach((c, id) => { if (c > 1) push("bad", `担当ID「${id}」が重複しています。`); });
  ids.forEach((c, id) => { if (c > 1) push("bad", `ステップID「${id}」が重複しています。`, id); });
  if (!f.steps.length) push("warn", "ステップがまだありません。");
  const starts = f.steps.filter(s => s.type === "start");
  if (f.steps.length && !starts.length) push("warn", "開始ステップがありません。最初のステップの種類を「開始」にしてください。");
  if (f.steps.length && !f.steps.some(s => s.type === "end")) push("warn", "終了ステップがありません。");
  f.steps.forEach(s => {
    const nm = s.label || s.id;
    if (!s.label.trim()) push("warn", `「${s.id}」に内容が書かれていません。`, s.id);
    if (!laneIds.has(s.lane)) push("bad", `「${nm}」の担当「${s.lane || "未設定"}」が担当一覧にありません。`, s.id);
    s.next.forEach(e => { if (!ids.has(e.to)) push("bad", `「${nm}」の次「${e.to}」というステップはありません。`, s.id); });
    if (s.type !== "end" && !s.next.length) push("info", `「${nm}」の次のステップが決まっていません（行き止まり）。`, s.id);
    if (s.type === "end" && s.next.length) push("info", `終了「${nm}」の後にもステップがつながっています。`, s.id);
    if (s.type === "decision"){
      if (s.next.length < 2) push("warn", `判断「${nm}」の分岐が${s.next.length}本です。2本以上にしてください。`, s.id);
      else if (s.next.some(e => !e.when)) push("info", `判断「${nm}」に条件の書かれていない分岐があります。`, s.id);
    }
  });
  if (starts.length){
    const seen = new Set(), stack = starts.map(s => s.id), byId = new Map(f.steps.map(s => [s.id, s]));
    while (stack.length){ const id = stack.pop(); if (seen.has(id)) continue; seen.add(id); (byId.get(id)?.next || []).forEach(e => stack.push(e.to)); }
    f.steps.forEach(s => { if (!seen.has(s.id)) push("warn", `「${s.label || s.id}」は開始からたどり着けません。`, s.id); });
  }
  const used = new Set(f.steps.map(s => s.lane));
  f.lanes.forEach(l => { if (!used.has(l.id)) push("info", `担当「${l.name}」にはステップがありません。`); });
  const rank = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, b) => rank[a.level] - rank[b.level]);
}

/* ---------- layout & render ---------- */
// gap: 列と列の最小のすき間 / track: すき間を縦に走る線どうしの間隔 / chan: レーン上下端を横に走る線どうしの間隔
const G = { label: 104, pad: 22, gap: 44, nodeW: 134, nodeH: 58, laneH: 124, track: 8, chan: 6 };
// 条件ラベル：1行の文字数の目安（全角換算）と最大行数。超えた分は「…」で省略し、全文はホバーで見せる
const LB = { per: 8, max: 2, lineH: 12, font: 10 };
const textW = t => [...t].reduce((a, ch) => a + (/[\x00-\xff]/.test(ch) ? 0.58 : 1) * LB.font, 0);
function edgeLabel(t){
  const lines = wrapLabel(t, LB.per, LB.max);
  return { t, lines, w: Math.max(...lines.map(textW)) + 12, h: lines.length * LB.lineH + 6 };
}
const labelCut = t => !!t && edgeLabel(t).lines.join("") !== t;
const CUT_TIP = "長いため図では省略されます（全文は矢印のラベルにマウスを乗せると表示）";
const markCut = el => { const c = labelCut(el.value); el.classList.toggle("cut", c); el.title = c ? CUT_TIP : ""; };
function layout(f){
  const lanes = f.lanes.slice();
  const laneIdx = new Map(lanes.map((l, i) => [l.id, i]));
  if (f.steps.some(s => !laneIdx.has(s.lane))){ laneIdx.set("__none", lanes.length); lanes.push({ id: "__none", name: "（担当未設定）", ghost: true }); }
  const rowOf = s => laneIdx.has(s.lane) ? laneIdx.get(s.lane) : laneIdx.get("__none");
  const byId = new Map(); f.steps.forEach(s => { if (!byId.has(s.id)) byId.set(s.id, s); });
  const steps = [...byId.values()];
  // detect back edges with DFS from starts, then the rest in order
  const st = {}, back = new Set();
  const dfs = id => { st[id] = 1; for (const e of byId.get(id).next){ if (!byId.has(e.to)) continue; if (st[e.to] === 1) back.add(id + "\u0000" + e.to); else if (!st[e.to]) dfs(e.to); } st[id] = 2; };
  steps.filter(s => s.type === "start").forEach(s => { if (!st[s.id]) dfs(s.id); });
  steps.forEach(s => { if (!st[s.id]) dfs(s.id); });
  const isBack = (a, b) => back.has(a + "\u0000" + b);
  // topological order on forward edges
  const indeg = new Map(steps.map(s => [s.id, 0])), preds = new Map(steps.map(s => [s.id, []]));
  steps.forEach(s => s.next.forEach(e => { if (byId.has(e.to) && !isBack(s.id, e.to) && e.to !== s.id){ indeg.set(e.to, indeg.get(e.to) + 1); preds.get(e.to).push(s.id); } }));
  const q = steps.filter(s => indeg.get(s.id) === 0).map(s => s.id), order = [];
  while (q.length){ const id = q.shift(); order.push(id); byId.get(id).next.forEach(e => { if (byId.has(e.to) && !isBack(id, e.to) && e.to !== id){ indeg.set(e.to, indeg.get(e.to) - 1); if (indeg.get(e.to) === 0) q.push(e.to); } }); }
  steps.forEach(s => { if (!order.includes(s.id)) order.push(s.id); });

  /* columns: 同じレーンの前ステップなら次の列へ。別レーンから受け取るだけなら同じ列の真下・真上に置く。
     occ = ステップのあるマス、pass = 縦の矢印が通り抜けるマス */
  const col = new Map(), occ = new Set(), pass = new Set(), key = (r, c) => r + ":" + c;
  const free = (r, c) => !occ.has(key(r, c)) && !pass.has(key(r, c));
  const span = (r1, r2) => { const a = []; for (let r = Math.min(r1, r2) + 1; r < Math.max(r1, r2); r++) a.push(r); return a; };
  // 列を指定したステップ（図で左右に動かしたもの）は先にその列へ置く。同じマスが埋まっていれば右へずらす
  order.forEach(id => {
    const s = byId.get(id); if (!s.col) return;
    const r = rowOf(s); let c = s.col - 1;
    while (occ.has(key(r, c))) c++;
    occ.add(key(r, c)); col.set(id, c);
  });
  order.forEach(id => {
    if (col.has(id)) return;
    const r = rowOf(byId.get(id)), ps = [...new Set(preds.get(id))].filter(p => col.has(p)).map(p => ({ c: col.get(p), r: rowOf(byId.get(p)) }));
    let c = 0; ps.forEach(p => { c = Math.max(c, p.c + (p.r === r ? 1 : 0)); });
    const ok = c => free(r, c) && ps.every(p => p.c !== c || span(p.r, r).every(m => free(m, c)));

  });
  const maxCol = Math.max(0, ...col.values());
  const pos = new Map();
  steps.forEach(s => { const r = rowOf(s), c = col.get(s.id); pos.set(s.id, { x: 0, y: r * G.laneH + (G.laneH - G.nodeH) / 2, w: G.nodeW, h: G.nodeH, r, c }); });
  const blocked = (r, c1, c2) => { for (let c = c1 + 1; c < c2; c++) if (occ.has(key(r, c))) return true; return false; };

  /* edges: 経路の種類を決める
     straight 同じレーンを右へ / elbow すき間で折れて別レーンへ / skip レーン端を通って列を飛ばす（dskip は判断の下の頂点から）
     vert 同じ列の別レーンへ縦に / dv 判断の上下の頂点から出て別レーンへ / loop 差し戻し（下側を通る） / self 自分へ戻る */
  const edges = [];
  steps.forEach(s => s.next.forEach(e => {
    const t = byId.get(e.to); if (!t) return;
    const a = pos.get(s.id), b = pos.get(t.id);
    const E = { s, t, e, a, b, back: isBack(s.id, t.id) || s.id === t.id, label: e.when ? edgeLabel(e.when) : null };
    if (s.id === t.id) E.kind = "self";
    else if (E.back || b.c < a.c) E.kind = "loop";
    else if (b.c === a.c) E.kind = span(a.r, b.r).some(m => occ.has(key(m, a.c))) ? "loop" : "vert";
    else if (a.r === b.r) E.kind = blocked(a.r, a.c, b.c) ? "skip" : "straight";
    else E.kind = blocked(b.r, a.c, b.c) ? "skip" : "elbow";
    // 出入りする辺を指定した矢印は custom で引く。指定のない側は、自動で決まる経路（auto）の辺を使う
    if (E.kind !== "self" && (e.exit || e.entry)){ E.auto = E.kind; E.kind = "custom"; }
    edges.push(E);
  }));
  // 判断から別レーンへの分岐は、上下の頂点から縦に出す（向きごとに1本まで）
  steps.filter(s => s.type === "decision").forEach(s => {
    const mine = edges.filter(E => E.s === s);
    [true, false].forEach(up => {
      if (mine.some(E => (E.kind === "vert" || E.kind === "dv") && (E.b.r < E.a.r) === up)) return;
      const cand = mine.filter(E => (E.kind === "elbow" || E.kind === "skip") && E.b.r !== E.a.r && (E.b.r < E.a.r) === up
        && [...span(E.a.r, E.b.r), E.b.r].every(m => free(m, E.a.c)) && !blocked(E.b.r, E.a.c, E.b.c))
        .sort((x, y) => Math.abs(x.b.r - x.a.r) - Math.abs(y.b.r - y.a.r))[0];
      if (cand) cand.kind = "dv";
    });
    // 同じレーンで列を飛ばす分岐は、下の頂点から出してレーン下端を通す（右の頂点は隣の列へ渡す）
    const skip = mine.find(E => E.kind === "skip" && E.a.r === E.b.r);
    if (skip && mine.some(E => E !== skip && /straight|elbow/.test(E.kind)) && !mine.some(E => (E.kind === "vert" || E.kind === "dv") && E.b.r > E.a.r)) skip.kind = "dskip";
  });
  // ports: 同じ辺から出入りする矢印は、相手の位置の順に並べて少しずつずらす
  const ports = new Map();
  const addPort = (id, sd, E, end, o) => { const k = id + "\u0000" + sd; if (!ports.has(k)) ports.set(k, []); ports.get(k).push({ E, end, o }); };
  // 判断の上下の頂点から縦に出る線が通るマス
  const dvCells = new Set();
  edges.forEach(E => { if (E.kind === "dv") [...span(E.a.r, E.b.r), E.b.r].forEach(m => dvCells.add(key(m, E.a.c))); });
  // 差し戻しを戻り先の真下から（列のすき間を回らず）上げられるか
  const loopDirect = E => E.b.r < E.a.r && [...span(E.a.r, E.b.r), E.a.r].every(m => free(m, E.b.c) && !dvCells.has(key(m, E.b.c)));

    else if (k === "vert") [E.so, E.ti] = up ? ["T", "B"] : ["B", "T"];
    else if (k === "loop") [E.so, E.ti] = ["B", "B"];

     左から入るほうが道のりが短ければ左へ入れる（下へ入れるために大きく回り込まないように） */
  {
    const cw = G.nodeW + G.gap, cx = c => c * cw + G.nodeW / 2, gx = c => c * cw - G.gap / 2;
    const chB = r => (r + 1) * G.laneH - 9, mid = r => r * G.laneH + G.laneH / 2, bot = r => mid(r) + G.nodeH / 2;
    const leftUsed = id => edges.some(F => (F.t.id === id && F.ti === "L") || (F.s.id === id && F.so === "L"));
    edges.forEach(E => {
      if (E.kind !== "loop" || leftUsed(E.t.id)) return;

      const viaBottom = a.r === b.r || loopDirect(E)
        ? Math.abs(sx - cx(b.c)) + Math.abs(sy - bot(b.r))

      const viaLeft = Math.abs(sx - gx(b.c)) + Math.abs(sy - mid(b.r)) + G.gap / 2;
      if (viaLeft < viaBottom){ E.ti = "L"; E.leftIn = true; }

  }
  edges.forEach(E => { if (E.so){ addPort(E.s.id, E.so, E, "s", E.b); addPort(E.t.id, E.ti, E, "t", E.a); } });
  ports.forEach((list, k) => {
    const horiz = /[TB]$/.test(k);
    list.sort((p, q) => horiz ? (p.o.c - q.o.c) || (p.o.r - q.o.r) : (p.o.r - q.o.r) || (p.o.c - q.o.c));
    const n = list.length, half = horiz ? G.nodeW / 2 - 22 : G.nodeH / 2 - 12, step = n > 1 ? Math.min(horiz ? 18 : 14, 2 * half / (n - 1)) : 0;
    list.forEach((p, i) => { p.E[p.end === "s" ? "oo" : "io"] = (i - (n - 1) / 2) * step; p.E[p.end === "s" ? "on" : "in"] = n; });
  });
  edges.forEach(E => { if (E.so){ E.sy = portAt(E.s, E.a, E.so, E.oo)[1]; E.ty = portAt(E.t, E.b, E.ti, E.io)[1]; } });

  // channels: レーン上下端を横に走る線は、同じ端を使う順に少しずつずらす

  edges.forEach(E => {
    const { a, b } = E;
    if (E.label && /^(straight|elbow|skip)$/.test(E.kind)) zone.set(a.c, Math.max(zone.get(a.c) || 0, E.label.w + 10));

    else if (E.kind === "elbow") E.tx = track(a.c, E, "x", E.sy, E.ty);

    } else if (E.kind === "dskip"){

    } else if (E.kind === "loop"){

      if (E.leftIn) E.tb = track(b.c - 1, E, "b", E.chS, E.ty);
      else if (a.r === b.r) E.chT = E.chS;

  /* 同じすき間の縦線の並び：交差と横線の重なりが最も少ない順を選ぶ（重なりは交差より重く数える。同点なら rank の順）
     stubs = 縦線の両端から出る横線の高さと向き（L は左の箱から来る、R は右へ出ていく） */
  const stubs = t => t.role === "b" ? [[t.y1, "R"], [t.y2, "R"]] : [[t.y1, "L"], [t.y2, "R"]];
  const inside = (y, t) => y > Math.min(t.y1, t.y2) + 0.5 && y < Math.max(t.y1, t.y2) - 0.5;
  const pairCost = (P, Q) => { // P が左、Q が右
    let c = 0;
    stubs(P).forEach(([y, sd]) => { if (sd === "R"){ if (inside(y, Q)) c += 1; if (stubs(Q).some(([y2]) => Math.abs(y2 - y) < 1)) c += 10; } });
    stubs(Q).forEach(([y, sd]) => { if (sd === "L"){ if (inside(y, P)) c += 1; if (stubs(P).some(([y2, s2]) => s2 === "L" && Math.abs(y2 - y) < 1)) c += 10; } });
    return c;
  };

    let best = list, bc = cost(list);
    if (n <= 7){

      while (moved){ moved = false; for (let i = 0; i + 1 < n; i++){ const o = best.slice(); [o[i], o[i + 1]] = [o[i + 1], o[i]]; const c = cost(o); if (c < bc){ bc = c; best = o; moved = true; } } }
    }

     どちらかの箱の出入り口を、その縦線が伸びる向きへ少しずらす（その辺に矢印が1本だけのときに限る） */
  const portOf = (t, k) => t.role === "x" ? (k ? (t.E.kind === "elbow" ? "t" : null) : "s") : t.role === "n" ? (k ? "t" : (t.E.kind === "straight" ? "s" : null)) : null;

    const o = end === "s" ? "oo" : "io", lim = G.nodeH / 2 - 10;

  for (let g = -1; g <= maxCol; g++){

    list.forEach((P, i) => list.slice(i + 1).forEach(Q => {
      if (P.role !== "b" && Q.role !== "b" && P.E !== Q.E && Math.abs(P.y1 - Q.y2) < 6) nudge(Q, 1) || nudge(P, 0);
    }));
    const z = zone.get(g) || 0, n = list.length;
    const need = z + (n ? 10 + (n - 1) * G.track + 12 : z ? 14 : 0);
    gapW.set(g, Math.max(g < 0 ? G.pad : G.gap, need));
    const extra = z ? 0 : (gapW.get(g) - need) / 2;
    list.forEach((t, i) => { t.off = z + extra + 10 + i * G.track; });
  }
  const colX = [G.label + gapW.get(-1)];
  for (let c = 1; c <= maxCol; c++) colX[c] = colX[c - 1] + G.nodeW + gapW.get(c - 1);
  pos.forEach(p => { p.x = colX[p.c]; });
  const gapX = g => g < 0 ? G.label : colX[g] + G.nodeW;
  const tx = (g, t) => gapX(g) + t.off;

  /* 辺を指定した矢印（custom）の経路：出口・入口から少し外へ出し、その間を縦横の線でつなぐ。
     折れる位置は、列のすき間の中央・レーン上下端の通り道などから、ステップの箱を横切らず短く折れの少ないものを選ぶ */
  const boxes = steps.map(s => { const p = pos.get(s.id), d = s.type === "decision"; return { id: s.id, x1: p.x - (d ? 4 : 0) - 3, y1: p.y - (d ? 6 : 0) - 3, x2: p.x + p.w + (d ? 4 : 0) + 3, y2: p.y + p.h + (d ? 6 : 0) + 3 }; });
  const DIR = { R: [1, 0], L: [-1, 0], T: [0, -1], B: [0, 1] };
  const cuts = (p, q, b) => p[1] === q[1]
    ? p[1] > b.y1 && p[1] < b.y2 && Math.max(p[0], q[0]) > b.x1 && Math.min(p[0], q[0]) < b.x2
    : p[0] > b.x1 && p[0] < b.x2 && Math.max(p[1], q[1]) > b.y1 && Math.min(p[1], q[1]) < b.y2;
  // 2本の縦横の線分が 5px 以内で平行に並び、10px 以上重なっているか
  const alongside = (p, q, u, v) => {
    if (p[1] === q[1] && u[1] === v[1] && Math.abs(p[1] - u[1]) < 5) return Math.min(Math.max(p[0], q[0]), Math.max(u[0], v[0])) - Math.max(Math.min(p[0], q[0]), Math.min(u[0], v[0])) > 10;
    if (p[0] === q[0] && u[0] === v[0] && Math.abs(p[0] - u[0]) < 5) return Math.min(Math.max(p[1], q[1]), Math.max(u[1], v[1])) - Math.max(Math.min(p[1], q[1]), Math.min(u[1], v[1])) > 10;

  };
  const xsMid = []; for (let g = -1; g <= maxCol; g++) xsMid.push(gapX(g) + (g < maxCol ? gapW.get(g) : G.pad) / 2);
  const ysMid = []; lanes.forEach((l, r) => ysMid.push(r * G.laneH + 9, (r + 1) * G.laneH - 9));

    if (below) s += handle("B", p.x + p.w / 2, p.y + p.h + 22, `次のステップを「${below.name}」に追加・ドラッグで別のステップにつなぐ`);
  }
  // 選択中の矢印の両端に丸。ドラッグでつなぎ替え・出入りする辺の指定
  const SE = L.edges.find(isSelEdge);
  if (SE){
    const end = (k, [x, y], tip) => `<circle class="ehandle" data-end="${k}" cx="${x}" cy="${y}" r="6"><title>${esc(tip)}</title></circle>`;
    s += end("s", SE.pts[0], "ドラッグで出るステップ・出る辺を変える");
    s += end("t", SE.pts[SE.pts.length - 1], "ドラッグでつなぎ先・入る辺を変える");
  }
  return `<div class="diagram">${head}${s}</svg></div>`;
}

/* ---------- state ---------- */
let db = null, store = "pending";
const records = new Map();
let currentId = null, flow = null, yamlSrc = "", selected = null, issues = [];
let hovMouse = null, hovFocus = null; // マウスを乗せた・キーボードで選んだステップや矢印（applyHover）
let selEdge = null; // 図の上で選んだ矢印 { sid: つなぎ元のステップ, k: next の何番目か }。ステップの選択とは同時に持たない
let dirty = false, saving = false, again = false, saveTimer = 0;
let zoom = 1, tab = "edit";
let lastL = null; // 最後に描いた図の配置（図の上でのドラッグ操作で使う）

/* 元に戻す（Ctrl+Z）/ やり直す（Ctrl+Y・Ctrl+Shift+Z）。変更前の YAML を積んでおく。
   文字入力は 1.5 秒以内の続きをまとめて 1 回分にする */
let undoSt = [], redoSt = [], undoAt = 0, undoKind = "";
function pushUndo(kind){
  const now = Date.now();
  if (kind !== "op" && kind === undoKind && now - undoAt < 1500){ undoAt = now; return; }
  undoSt.push({ yaml: yamlSrc, sel: selected }); if (undoSt.length > 100) undoSt.shift();
  redoSt = []; undoAt = now; undoKind = kind;
}
function resetUndo(){ undoSt = []; redoSt = []; undoKind = ""; }

function setStatus(kind, text){
  const el = $("#saveState"), mem = store === "memory";
  // memory：ファイルに保存（エクスポート）していない変更があるうちは「未保存」と出す
  if (kind === "saved" && !text && mem && unexported.has(currentId)) kind = "dirty";
  const map = { loading: "読み込み中", dirty: mem ? "未保存（このタブのみ）" : "未保存の変更", saving: "保存中…", saved: mem ? "ファイルに保存済み" : "保存済み", error: "保存できませんでした" };
  el.className = "pill " + kind; el.textContent = text || map[kind] || "";
  el.title = mem ? "このブラウザにはフローを保存しません。「エクスポート」→ YAML ファイルとして保存してください（Ctrl+S でも保存できます）" : "";
}
let toastT = 0;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }

function fmtTime(ms){ if (!ms) return ""; const d = new Date(ms); const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function newDocId(){ return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- persistence ---------- */
// 保存先（store）：db＝アーティファクトのDB / folder＝作業フォルダの .yaml ファイル / memory＝このタブのメモリだけ
// ブラウザ内（localStorage・IndexedDB）にはフローの中身を置かない。置くのはパネルの幅と、作業フォルダの参照だけ
const HIST_DIR = ".flowbook-history"; // 版の履歴：1フロー1ファイル（最大20版）
let dir = null, histDir = null, lastDir = null;
const fileMeta = new Map(); // ファイル名 -> { mod: 最後に読み書きしたときの更新日時, hist: 書き出した履歴の印 }
const unexported = new Set(); // memory：ファイルに保存していない変更があるフロー
let conflictId = null; // ほかのアプリでファイルが変わったため、保存を止めているフロー
let broken = false; // 開いたフローの YAML が読み取れない（直すまで保存しない）
let legacy = null; // 以前のバージョンが localStorage に保存したフロー（移行するまで残す）
const histMark = h => (h || []).length + ":" + ((h || [])[0]?.at || 0);

function readLegacy(){
  try { const o = JSON.parse(lsGet(LS_KEY) || "null"); return o && typeof o === "object" && Object.keys(o).length ? o : null; } catch { return null; }
}
function recordOf(name, text, at, history){
  let f = null; try { f = parseYaml(text); } catch {}
  return { name: f ? f.name : name.replace(/\.ya?ml$/i, ""), owner: f?.owner || "", yaml: text, updatedAt: at, steps: f ? f.steps.length : 0, history: history || [] };
}
async function readHist(name){
  if (!histDir) return [];
  try {
    const v = jsyaml.load(await (await (await histDir.getFileHandle(name)).getFile()).text());
    return Array.isArray(v) ? v.filter(e => e && typeof e.yaml === "string").slice(0, 20) : [];
  } catch { return []; }
}
// 作業フォルダ直下の .yaml / .yml を読む。前回から変わっていないファイルは読み直さない
async function scanDir(){
  try { histDir = await dir.getDirectoryHandle(HIST_DIR); } catch { histDir = null; }
  const seen = new Set();
  for await (const [name, h] of dir.entries()){
    if (h.kind !== "file" || !/\.ya?ml$/i.test(name)) continue;
    seen.add(name);
    const file = await h.getFile(), m = fileMeta.get(name);
    if (m && m.mod === file.lastModified && records.has(name)) continue;
    if (name === currentId && saving) continue;
    // 編集中のフローがほかで変わった：上書きせず、どちらを残すか選んでもらう
    if (name === currentId && dirty){ conflictId = name; continue; }
    const history = await readHist(name);
    records.set(name, recordOf(name, await file.text(), file.lastModified, history));
    fileMeta.set(name, { mod: file.lastModified, hist: histMark(history) });
  }
  [...records.keys()].forEach(k => { if (!seen.has(k) && k !== pendingCreate){ records.delete(k); fileMeta.delete(k); } });
}
async function writeText(dh, name, text){
  const h = await dh.getFileHandle(name, { create: true }), w = await h.createWritable();
  await w.write(text); await w.close();
  return h;
}
async function persistFile(id, rec, force){
  const m = fileMeta.get(id);
  let h = null; try { h = await dir.getFileHandle(id); } catch {}
  if (h && m && !force && (await h.getFile()).lastModified !== m.mod) throw Object.assign(new Error("changed"), { code: "conflict" });
  h = await writeText(dir, id, rec.yaml);
  const hist = histMark(rec.history);
  if (!m || m.hist !== hist){
    if (rec.history.length){
      histDir = histDir || await dir.getDirectoryHandle(HIST_DIR, { create: true });
      await writeText(histDir, id, jsyaml.dump(rec.history, { lineWidth: -1, noRefs: true }));
    } else if (histDir) await histDir.removeEntry(id).catch(() => {});
  }
  fileMeta.set(id, { mod: (await h.getFile()).lastModified, hist });
}
async function removeRecord(id){
  if (store === "db") return db.collection("flows").doc(id).delete();
  unexported.delete(id);
  if (store !== "folder") return;
  fileMeta.delete(id);
  if (histDir) await histDir.removeEntry(id).catch(() => {});
  await dir.removeEntry(id).catch(e => { if (e?.name !== "NotFoundError") throw e; });
}
// フロー名からファイル名を決める。ほかのフローと重なるときは「（2）」などを付ける
async function freeName(title, self){
  const base = safeName(title || "無題").trim() || "flow";
  for (let k = 1; ; k++){
    const n = base + (k > 1 ? `（${k}）` : "") + ".yaml";
    if (n === self) return n;
    if (records.has(n)) continue;
    try { await dir.getFileHandle(n); continue; } catch {}
    return n;
  }
}
// フロー名を変えたら、ファイル名（と履歴のファイル名）も合わせる
async function renameFile(){
  if (store !== "folder" || !dir || !currentId || broken) return;
  const old = currentId;
  const want = await freeName(flow.name, old);
  if (want === old) return;
  const wait = async () => { while (saving) await new Promise(r => setTimeout(r, 50)); };
  await wait(); if (dirty) await saveNow(); await wait();
  if (dirty || conflictId === old || currentId !== old) return;
  const rec = records.get(old); if (!rec) return;
  try {
    await persistFile(want, rec);
    if (histDir) await histDir.removeEntry(old).catch(() => {});
    await dir.removeEntry(old).catch(() => {});
  } catch { toast("ファイル名を変えられませんでした"); return; }
  records.delete(old); fileMeta.delete(old); records.set(want, rec);
  if (currentId === old) currentId = want;
  renderList(); toast(`ファイル名を「${want}」に変えました`);
}

async function chooseFolder(){
  let h;
  try { h = await window.showDirectoryPicker({ id: "gyomu-flow-folder", mode: "readwrite" }); }
  catch (e){ if (e?.name !== "AbortError") toast("フォルダを開けませんでした"); return false; }
  await openDir(h); return true;
}
async function reopenFolder(){
  try { if (lastDir && await lastDir.requestPermission({ mode: "readwrite" }) === "granted"){ await openDir(lastDir); return; } } catch {}
  toast("前回のフォルダを開けませんでした。フォルダを選び直してください");
}
async function openDir(h){
  if (dirty) await saveNow();
  dir = lastDir = h; histDir = null; idbSet("folder", h);
  store = "folder";
  records.clear(); fileMeta.clear(); unexported.clear();
  currentId = null; flow = null; dirty = false; conflictId = null;
  setStatus("loading");
  try { await scanDir(); } catch { toast("フォルダを読み込めませんでした"); }
  updateStoreUi();
  firstRecords = true; onRecords();
}
function startMemory(){
  store = "memory"; dir = null;
  // 以前のデータは、このタブで見られるようにしたうえで、ファイルに保存してから消してもらう
  if (legacy) Object.entries(legacy).forEach(([k, v]) => { if (v && typeof v.yaml === "string"){ records.set(k, { ...v, history: Array.isArray(v.history) ? v.history : [] }); unexported.add(k); } });
  updateStoreUi();
  firstRecords = true; onRecords();
}
function updateStoreUi(){
  const note = $("#storeNote");
  $("#folderBtn").hidden = !(store === "folder" && dir);
  if (dir) $("#folderName").textContent = dir.name;
  note.classList.toggle("warn", store === "memory");
  if (store === "folder") note.textContent = dir ? `フローは作業フォルダ「${dir.name}」に .yaml ファイルとして保存します。` : "作業フォルダを開くと、フローをそのフォルダに保存します。";
  else if (store === "memory") note.textContent = "このブラウザにはフローを保存しません。タブを閉じると消えるので、「エクスポート」→ YAML ファイルとして保存してください（Ctrl+S でも保存できます）。保存したファイルは「インポート」で開けます。";
  renderNotice();
}
function renderNotice(){
  const el = $("#notice");
  if (conflictId && conflictId === currentId){
    el.innerHTML = `<span>このフローのファイル「${esc(currentId)}」が、ほかのアプリなどで変更されています。保存を止めています。</span><button class="btn sm primary" data-note="reload">ファイルの内容を読み込む</button><button class="btn sm danger" data-note="overwrite">この画面の内容で上書き</button>`;
    el.hidden = false; return;
  }
  if (legacy && (store === "memory" || (store === "folder" && dir))){
    const n = Object.keys(legacy).length;
    el.innerHTML = store === "folder"
      ? `<span>以前のバージョンでブラウザ内に保存したフローが ${n} 件あります。作業フォルダへ移すと、ブラウザ内からは削除します。</span><button class="btn sm primary" data-note="migrate">作業フォルダへ移す</button><button class="btn sm danger" data-note="discard">移さずに削除</button>`
      : `<span>以前のバージョンでブラウザ内に保存したフローが ${n} 件あります（一覧に出しています）。YAML ファイルに保存してから、ブラウザ内から削除してください。</span><button class="btn sm" data-note="save-all">すべて YAML で保存</button><button class="btn sm danger" data-note="discard">ブラウザ内から削除</button>`;
    el.hidden = false; return;
  }
  el.hidden = true; el.innerHTML = "";
}
async function migrateLegacy(){
  let ok = 0, ng = 0;
  for (const [k, r] of Object.entries(legacy)){
    if (!r || typeof r.yaml !== "string"){ delete legacy[k]; continue; }
    try {
      const id = await freeName(r.name), history = Array.isArray(r.history) ? r.history.slice(0, 20) : [];
      const rec = recordOf(id, r.yaml, r.updatedAt || Date.now(), history);
      pendingCreate = id; await persistFile(id, rec); records.set(id, rec);
      delete legacy[k]; ok++;
    } catch { ng++; }
  }
  pendingCreate = null;
  if (Object.keys(legacy).length){ lsSet(LS_KEY, JSON.stringify(legacy)); toast(`${ng} 件を書き出せませんでした。ブラウザ内のデータは残しています`); }
  else { lsDel(LS_KEY); legacy = null; toast(`${ok} 件を作業フォルダへ移し、ブラウザ内から削除しました`); }
  renderNotice(); onRecords();
}
async function saveAllLegacy(){
  for (const k of Object.keys(legacy)){
    const r = records.get(k); if (!r) continue;
    downloadFile(safeName(r.name) + ".yaml", r.yaml.replace(/\n?$/, "\n"));
    unexported.delete(k);
    await new Promise(res => setTimeout(res, 400));
  }
  setStatus(dirty ? "dirty" : "saved");
  toast("ダウンロードしました。保存できたことを確かめてから、ブラウザ内から削除してください");
}
$("#notice").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-note]"); if (!b) return;
  switch (b.dataset.note){
    case "reload": {
      conflictId = null; dirty = false; clearTimeout(saveTimer); fileMeta.delete(currentId);
      try { await scanDir(); } catch {}
      renderNotice();
      if (records.has(currentId)) open(currentId, true); else { const p = sortedIds()[0]; p ? open(p) : showEmpty(); }
      toast("ファイルの内容を読み込みました"); return;
    }
    case "overwrite": conflictId = null; renderNotice(); await saveNow(true); return;
    case "migrate": migrateLegacy(); return;
    case "save-all": saveAllLegacy(); return;
    case "discard":
      b.dataset.orig = b.textContent; if (!arm(b, "legacy", "もう一度押すと削除")) return;
      lsDel(LS_KEY); legacy = null; renderNotice(); toast("ブラウザ内に残っていた以前のデータを削除しました"); return;
  }
});
function gateHtml(){
  const btns = lastDir
    ? `<button class="btn primary" data-folder="reopen">前回のフォルダ「${esc(lastDir.name)}」を開く</button><button class="btn" data-folder="pick">別のフォルダを選ぶ</button>`
    : `<button class="btn primary" data-folder="pick">作業フォルダを選ぶ</button>`;
  const old = legacy ? `<p>以前のバージョンでブラウザ内に保存したフローが ${Object.keys(legacy).length} 件あります。作業フォルダを開くと、そこへ移せます。</p>` : "";
  return `<div class="empty"><h2>作業フォルダを開きましょう</h2><p>フローは、選んだフォルダに 1 フローずつ YAML ファイル（.yaml）として保存します。ブラウザ内にはフローの中身を保存しません。共有フォルダや Git で管理しているフォルダも選べます。</p>${old}<div class="row">${btns}</div><div class="row"><button class="btn ghost sm" data-folder="memory">フォルダを使わずに試す（タブを閉じると消えます）</button></div></div>`;
}
function folderAction(kind){
  if (kind === "reopen") reopenFolder();
  else if (kind === "pick") chooseFolder();
  else if (kind === "memory"){ startMemory(); toast("フォルダを使わずに開きました。残したいフローは「エクスポート」で保存してください"); }
}

async function initStore(){
  let d = null;
  try { d = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; } catch { d = null; }
  lsDel(LS_CUR);
  if (d){
    db = d; store = "db";
    $("#storeNote").textContent = "フローはこのアプリに保存され、共有した相手とも同じ内容を見られます。";
    db.collection("flows").onSnapshot(snap => {
      const seen = new Set();
      snap.docs.forEach(doc => { seen.add(doc.id); const v = doc.data(); if (!(saving && doc.id === currentId)) records.set(doc.id, v); });
      [...records.keys()].forEach(k => { if (!seen.has(k) && k !== pendingCreate) records.delete(k); });
      onRecords();
    }, () => { setStatus("error", "接続が切れました"); });
    return;
  }
  legacy = readLegacy();
  if (typeof window.showDirectoryPicker !== "function"){ startMemory(); return; }
  store = "folder";
  lastDir = await idbGet("folder");
  // Chrome で「毎回許可」を選んでいれば、ボタンを押さなくても前回のフォルダを開く
  try { if (lastDir && await lastDir.queryPermission({ mode: "readwrite" }) === "granted"){ await openDir(lastDir); return; } } catch {}
  updateStoreUi();
  onRecords();
}
let pendingCreate = null, firstRecords = true;
function onRecords(){
  renderList();
  if (firstRecords){
    firstRecords = false;
    const pick = sortedIds()[0];
    if (pick) open(pick); else showEmpty();
    return;
  }
  if (currentId && !records.has(currentId) && currentId !== pendingCreate){
    const pick = sortedIds()[0]; if (pick) open(pick); else showEmpty(); return;
  }
  if (!currentId){ const pick = sortedIds()[0]; if (pick) open(pick); return; }
  const r = records.get(currentId);
  if (r && !dirty && !saving && r.yaml !== yamlSrc) open(currentId, true);
  if (tab === "hist") renderHist();
}
function sortedIds(){ return [...records.entries()].sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0)).map(e => e[0]); }

function buildRecord(id){
  const prev = records.get(id);
  let history = (prev && Array.isArray(prev.history)) ? prev.history.slice() : [];
  if (prev && prev.yaml && prev.yaml !== yamlSrc){
    const last = history[0];
    if (!last || (Date.now() - last.at) > 10 * 60 * 1000) history.unshift({ at: prev.updatedAt || Date.now(), name: prev.name, yaml: prev.yaml });
  }
  history = history.slice(0, 20);
  return { name: flow.name, owner: flow.owner || "", yaml: yamlSrc, updatedAt: Date.now(), steps: flow.steps.length, history };
}
function markDirty(){
  dirty = true; setStatus("dirty");
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 900);
}
// force：ほかのアプリでファイルが変わっていても上書きする（「この画面の内容で上書き」）
async function saveNow(force){
  if (!currentId || !flow) return;
  if (broken){ clearTimeout(saveTimer); setStatus("error", "読み取れないため保存していません"); return; }
  if (conflictId === currentId && force !== true){ clearTimeout(saveTimer); setStatus("error", "ほかで変更されています"); renderNotice(); return; }
  if (saving){ again = true; return; }
  clearTimeout(saveTimer);
  saving = true; if (store !== "memory") setStatus("saving");
  const id = currentId, rec = buildRecord(id);
  records.set(id, rec); dirty = false;
  try {
    if (store === "db") await db.collection("flows").doc(id).set(rec);
    else if (store === "folder") await persistFile(id, rec, force === true);
    else unexported.add(id);
    if (pendingCreate === id) pendingCreate = null;
    setStatus(dirty ? "dirty" : "saved");
  } catch (err){
    dirty = true;
    if (err && err.code === "conflict"){ conflictId = id; renderNotice(); setStatus("error", "ほかで変更されています"); }
    else setStatus("error", err && err.code === "invalid_argument" ? "閲覧のみ（保存できません）" : err && err.code === "quota_exceeded" ? "保存容量の上限です" : "保存できませんでした");
  }
  saving = false;
  renderList();
  if (again){ again = false; saveNow(); }
}

/* ---------- open / create ---------- */
function open(id, keepSel){
  const r = records.get(id); if (!r) return;
  if (dirty && currentId && currentId !== id) saveNow();
  const isNew = currentId !== id;
  if (conflictId && conflictId !== id) conflictId = null;
  currentId = id; resetUndo();
  yamlSrc = r.yaml || "";
  let err = null;
  try { flow = parseYaml(yamlSrc); } catch (e){ err = e; flow = normalize({ name: r.name || "読み込めないフロー", lanes: [], steps: [] }); }
  broken = !!err;
  if (!keepSel || !flow.steps.some(s => s.id === selected)) selected = null;
  selEdge = null;
  dirty = false; setStatus("saved");
  $("#flowName").disabled = false; $("#exportBtn").disabled = false;
  $("#flowName").value = flow.name;
  $("#yamlText").value = yamlSrc; setYamlMsg();
  refresh(true);
  if (isNew) fitZoom();
  renderList();
  renderNotice();
  closeSide();
  // 読み取れない YAML：元の文面を消さないよう保存を止め、YAML タブで直してもらう
  if (err){ setTab("yaml"); setYamlMsg(`読み取れません。${err.mark ? err.mark.line + 1 + "行目：" : ""}${err.reason || err.message}（直すまで保存されません）`); setStatus("error", "読み取れません"); }
}
// opts.fromFile：ファイルから開いた（memory では、まだ保存していない変更として扱わない）
async function create(yamlText, opts = {}){
  if (store === "folder" && !dir && !(await chooseFolder())) return false;
  let f; try { f = parseYaml(yamlText); } catch (e){ toast("読み込めませんでした：" + e.message); return false; }
  let text = yamlText;
  if ([...records.values()].some(r => r.name === f.name)){ f.name += "（コピー）"; text = toYaml(f); }
  const id = store === "folder" ? await freeName(f.name) : newDocId();
  pendingCreate = id;
  records.set(id, { name: f.name, owner: f.owner, yaml: text, updatedAt: Date.now(), steps: f.steps.length, history: [] });
  open(id);
  selected = flow.steps[0]?.id || null; refresh(true);
  await saveNow();
  if (opts.fromFile && store === "memory"){ unexported.delete(id); setStatus("saved"); }
  return true;
}
function showEmpty(){

function commit(opts = {}){
  // form changed the model -> regenerate yaml
  // opts.form: 構造の変更（フォームを描き直し、元に戻すの 1 回分にする）/ opts.select: 変更後に選ぶステップ
  // 読み取れない YAML のフローは、元の文面を上書きしないよう図やフォームからは変えない
  if (broken){ open(currentId, true); toast("YAML タブで読み取れない箇所を直してから編集してください"); return; }
  const text = toYaml(flow);
  if (text !== yamlSrc) pushUndo(opts.form ? "op" : "type");
  yamlSrc = text;
  if ("select" in opts){ selected = opts.select; selEdge = opts.edge || null; }
  if (selEdge && !flow.steps.find(s => s.id === selEdge.sid)?.next[selEdge.k]) selEdge = null;
  if (document.activeElement !== $("#yamlText")) { $("#yamlText").value = yamlSrc; setYamlMsg(); }
  refresh(opts.form);
  markDirty();
}
function refresh(withForm){

  const c = $("#issueCount"); c.textContent = bad + warn; c.className = "count" + (bad ? " bad" : warn ? " warn" : "");

}

function revealStep(id){
  const c = $("#canvas"), g = c.querySelector(`[data-step="${CSS.escape(id)}"]`); if (!g) return;
  const cr = c.getBoundingClientRect(), r = g.getBoundingClientRect(), m = 16, left = cr.left + G.label * zoom + m;
  if (r.left < left) c.scrollLeft -= left - r.left;
  else if (r.right > cr.right - m) c.scrollLeft += Math.min(r.right - (cr.right - m), r.left - left);
  if (r.top < cr.top + m) c.scrollTop -= cr.top + m - r.top;
  else if (r.bottom > cr.bottom - m) c.scrollTop += Math.min(r.bottom - (cr.bottom - m), r.top - (cr.top + m));

function selectEdge(sid, k){

function deleteStep(id){
  const s = flow.steps.find(x => x.id === id); if (!s) return;
  // reconnect: predecessors that pointed here now point to this step's successors (when single)
  flow.steps.forEach(p => {
    const k = p.next.findIndex(e => e.to === s.id); if (k < 0) return;
    const repl = s.next.filter(e => e.to !== p.id && !p.next.some(x => x.to === e.to)).map(e => ({ to: e.to, when: p.next[k].when || e.when }));
    p.next.splice(k, 1, ...(s.next.length === 1 ? repl : []));
  });
  flow.steps.splice(flow.steps.indexOf(s), 1);
}

/* 担当IDを変える。その担当に割り振っていたステップの lane もまとめて新しいIDに置き換える。

function renameLane(i, inp){
  const l = flow.lanes[i]; if (!l) return;
  const oldId = l.id, newId = inp.value.trim();
  if (newId === oldId){ inp.value = oldId; return; }
  if (!newId){ inp.value = oldId; toast("担当IDは空にできません"); return; }
  if (flow.lanes.some((x, k) => k !== i && x.id === newId)){ inp.value = oldId; toast(`担当ID「${newId}」はすでに使われています`); return; }
  const shared = flow.lanes.some((x, k) => k !== i && x.id === oldId);
  const moved = shared ? [] : flow.steps.filter(s => s.lane === oldId);
  l.id = newId; moved.forEach(s => s.lane = newId);
  commit({ form: true });
  toast(moved.length ? `担当IDを「${newId}」に変更し、${moved.length} 件のステップの担当IDも置き換えました` : `担当IDを「${newId}」に変更しました`);
}

function arm(btn, key, label){
  if (armed === key){ armed = null; return true; }
  armed = key; btn.classList.add("armed"); btn.textContent = label;
  setTimeout(() => { if (armed === key){ armed = null; btn.classList.remove("armed"); btn.textContent = btn.dataset.orig; } }, 3500);
  return false;
}
onPanels("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b || !flow) return;
  const act = b.dataset.act, s = curStep(), i = +b.dataset.i;
  const idx = s ? flow.steps.indexOf(s) : -1;
  switch (act){
    case "goto-setup": setTab("setup"); return;
    case "select": select(selected === b.dataset.id ? null : b.dataset.id, false); return;
    case "lane-add": { const id = uid("lane", new Set(flow.lanes.map(l => l.id))); flow.lanes.push({ id, name: "新しい担当" }); commit({ form: true }); const el = $("#lane-" + CSS.escape(id)); el && (el.focus(), el.select()); return; }
    case "lane-up": [flow.lanes[i - 1], flow.lanes[i]] = [flow.lanes[i], flow.lanes[i - 1]]; break;
    case "lane-down": [flow.lanes[i + 1], flow.lanes[i]] = [flow.lanes[i], flow.lanes[i + 1]]; break;
    case "lane-del": {
      const l = flow.lanes[i], n = flow.steps.filter(x => x.lane === l.id).length;
      if (n){ b.dataset.orig = b.textContent; if (!arm(b, "lane" + l.id, "?")) { toast(`「${l.name}」には ${n} 件のステップがあります。もう一度 ✕ で削除します`); return; } }
      flow.lanes.splice(i, 1); break;
    }
    case "step-add": {
      const id = newStepId(); const last = flow.steps[flow.steps.length - 1];
      flow.steps.push({ id, type: flow.steps.length ? "task" : "start", lane: last?.lane || flow.lanes[0]?.id || "", label: "", note: "", issue: "", next: [] });
      selected = id; commit({ form: true }); focusLabel(); return;
    }
    case "insert-after": {
      const id = newStepId(); const ns = { id, type: "task", lane: s.lane, label: "", note: "", issue: "", next: s.type === "decision" ? [] : s.next.slice() };
      if (s.type === "decision") s.next.push({ to: id, when: "" }); else s.next = [{ to: id, when: "" }];
      if (s.type === "end"){ s.type = "task"; ns.type = "end"; ns.label = s.label; s.label = ""; ns.next = []; }
      flow.steps.splice(idx + 1, 0, ns); selected = id; commit({ form: true }); focusLabel(); return;
    }
    case "branch-add": {
      const id = newStepId(); flow.steps.splice(idx + 1, 0, { id, type: "task", lane: s.lane, label: "", note: "", issue: "", next: [] });
      s.next.push({ to: id, when: "" }); commit({ form: true }); const el = document.querySelector(`#nw-${CSS.escape(s.id)}-${s.next.length - 1}`); el && el.focus(); return;
    }
    case "sort-flow": {
      const L = layout(flow), key = st => { const p = L.pos.get(st.id); return p ? p.c * 1000 + p.r : 1e9; };
      const before = flow.steps.map(x => x.id).join();
      flow.steps.sort((a, b2) => key(a) - key(b2));
      if (before === flow.steps.map(x => x.id).join()){ toast("すでに図の順に並んでいます"); return; }
      toast("図の順に並べ替えました"); break;
    }
    case "renumber": {
      const cnt = {}; flow.steps.forEach(x => { const m = x.id.match(/^([A-Za-z_]+)\d+$/); if (m) cnt[m[1]] = (cnt[m[1]] || 0) + 1; });
      const pre = Object.keys(cnt).sort((p1, p2) => cnt[p2] - cnt[p1])[0] || "s";
      const map = new Map(flow.steps.map((x, k) => [x.id, pre + (k + 1)]));
      if (flow.steps.every(x => map.get(x.id) === x.id)){ toast("IDはすでに並び順どおりです"); return; }
      b.dataset.orig = "IDを振り直す"; if (!arm(b, "renum", "もう一度押して振り直す")) return;
      const r = records.get(currentId);
      if (r){ const history = (r.history || []).slice(); history.unshift({ at: Date.now(), name: flow.name, yaml: yamlSrc, memo: "ID振り直し前" }); records.set(currentId, { ...r, history: history.slice(0, 20) }); }
      flow.steps.forEach(x => { x.id = map.get(x.id); x.next.forEach(e => { if (map.has(e.to)) e.to = map.get(e.to); }); });
      if (selected) selected = map.get(selected) || null;
      toast(`IDを ${pre}1〜${pre}${flow.steps.length} に振り直しました（元の版は履歴に残しています）`); break;
    }
    case "step-up": if (idx > 0) [flow.steps[idx - 1], flow.steps[idx]] = [flow.steps[idx], flow.steps[idx - 1]]; break;
    case "step-down": if (idx < flow.steps.length - 1) [flow.steps[idx + 1], flow.steps[idx]] = [flow.steps[idx], flow.steps[idx + 1]]; break;
    case "step-del": {
      b.dataset.orig = "削除"; if (!arm(b, "step" + s.id, "もう一度押して削除")) return;
      deleteStep(s.id); commit({ form: true, select: null });
      toast("ステップを削除しました。前後のつながりは自動でつなぎ直しています（Ctrl+Z で元に戻せます）"); return;
    }
    case "next-del": s.next.splice(+b.dataset.k, 1); break;
    case "col-auto": delete s.col; toast("図の位置を自動に戻しました"); break;
    case "dup": { const f = JSON.parse(JSON.stringify(flow)); f.name += "（コピー）"; create(toYaml(f)).then(ok => ok && toast("複製しました")); return; }
    case "flow-del": {
      b.dataset.orig = "このフローを削除"; if (!arm(b, "flow" + currentId, "もう一度押すと完全に削除")) return;
      const id = currentId; records.delete(id); clearTimeout(saveTimer); dirty = false;
      removeRecord(id).catch(() => toast("削除できませんでした"));
      currentId = null; const pick = sortedIds()[0]; if (pick) open(pick); else showEmpty(); toast("フローを削除しました"); return;
    }
    default: return;
  }
  commit({ form: true });
});

// マウスを乗せた・キーボードで選んだステップや矢印に出入りする矢印と、その条件ラベルを強調する。
// 描き直さずにクラスだけ付け替える（描き直すとダブルクリックやフォーカスが途切れるため）
const hovKey = el => {
  const g = el?.closest?.("#canvas [data-step]"); if (g) return "step\n" + g.dataset.step;
  const e = el?.closest?.("#canvas .ehit, #canvas .elabel"); return e ? "edge\n" + e.dataset.edge + "\n" + e.dataset.k : null;
};
function applyHover(){
  const c = $("#canvas"), key = hovMouse || hovFocus;
  c.querySelectorAll(".hv").forEach(el => el.classList.remove("hv"));
  const busy = ["dragging", "linking", "reattaching", "panning"].some(k => c.classList.contains(k));
  const [kind, id, k] = key && !busy ? key.split("\n") : [];
  showTip(kind === "step" ? id : null);
  if (!kind) return;
  const paths = [...c.querySelectorAll("path.edge")].filter(p => kind === "step" ? p.dataset.s === id || p.dataset.t === id : p.dataset.s === id && p.dataset.k === k);
  const keys = new Set(paths.map(p => p.dataset.s + "\n" + p.dataset.k));
  paths.forEach(p => p.classList.add("hv"));
  c.querySelectorAll(".elabel").forEach(l => keys.has(l.dataset.edge + "\n" + l.dataset.k) && l.classList.add("hv"));
  // 強調した矢印はほかの矢印より手前へ（選択中の矢印と当たり判定よりは奥）
  const ref = c.querySelector("path.edge.hot") || c.querySelector(".ehit");
  paths.forEach(p => p.classList.contains("hot") || ref?.before(p));
}
/* 補足と課題のツールチップ。マウスを乗せた（キーボードで選んだ）ステップのすぐ下に、補足→課題の順で出す */
const TIP_ICON = {
  note: `<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="3" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.2"/><path d="M4 4.5h6M4 7h6M4 9.5h4" stroke="var(--muted)" stroke-width="1.2" stroke-linecap="round"/></svg>`,
  issue: `<svg viewBox="0 0 14 14" aria-hidden="true"><rect width="14" height="14" rx="3" fill="var(--bad)"/><path d="M7 3.2v4.6" stroke="var(--surface)" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="10.8" r="1.1" fill="var(--surface)"/></svg>`
};
let tipId = null;
function showTip(id){
  const tip = $("#stepTip"), st = id && flow ? flow.steps.find(s => s.id === id) : null;
  const g = st && (st.note || st.issue) && !inlineEd ? $("#canvas").querySelector(`[data-step="${CSS.escape(id)}"] .shape`) : null;
  if (!g){ tip.hidden = true; tipId = null; return; }
  if (tipId !== id){
    tipId = id;
    const sec = (cls, label, text) => `<div class="tt-sec ${cls}"><div class="tt-h">${TIP_ICON[cls.slice(3)]}${label}</div><div class="tt-b">${esc(text)}</div></div>`;
    tip.innerHTML = (st.note ? sec("tt-note", "補足", st.note) : "") + (st.issue ? sec("tt-issue", "課題", st.issue) : "");
  }
  // 図の見えている範囲から外れたステップには出さない
  const r = g.getBoundingClientRect(), cr = $("#canvas").getBoundingClientRect();
  if (r.bottom < cr.top || r.top > cr.bottom || r.right < cr.left + G.label * zoom || r.left > cr.right){ tip.hidden = true; return; }
  tip.hidden = false;
  const m = 8, w = tip.offsetWidth, h = tip.offsetHeight;
  const x = Math.max(m, Math.min(innerWidth - w - m, r.left + r.width / 2 - w / 2));
  let y = r.bottom + 10; if (y + h > innerHeight - m) y = Math.max(m, r.top - h - 10);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { $("#stepTip").hidden = true; tipId = null; };
// ドラッグやダブルクリックでの編集を始めたら隠す（描き直したあとに、乗せたままなら出し直す）

$("#canvas").addEventListener("mouseover", ev => { const key = hovKey(ev.target); if (key !== hovMouse){ hovMouse = key; applyHover(); } });

$("#canvas").addEventListener("focusin", ev => { hovFocus = ev.target.matches(":focus-visible") ? hovKey(ev.target) : null; applyHover(); });

// 拡大縮小。(px, py) は canvas 内での基準点（省略時は表示の中心）で、その位置の図が動かないようにスクロールを直す
function setZoom(z, px, py){
  const old = zoom; zoom = Math.min(2, Math.max(0.2, Math.round(z * 100) / 100));
  if (!flow || zoom === old) return;
  const c = $("#canvas"), PX = 16, PY = 20;
  if (px == null) px = c.clientWidth / 2;
  if (py == null) py = c.clientHeight / 2;
  const r = zoom / old, x = c.scrollLeft + px, y = c.scrollTop + py;
  drawCanvas();
  c.scrollLeft = (x - PX) * r + PX - px; c.scrollTop = (y - PY) * r + PY - py;
}
function fitZoom(){
  if (!flow) return; const L = layout(flow), c = $("#canvas"); if (!c.clientWidth) return;
  const z = Math.min((c.clientWidth - 34) / Math.max(L.width, 420), (c.clientHeight - 42) / L.height, 1.4);
  zoom = Math.min(2, Math.max(0.2, Math.round(z * 100) / 100)); drawCanvas(); c.scrollLeft = 0; c.scrollTop = 0;
}
// ドラッグ操作のあとのクリックは「選択解除」として扱わない

// 10% ずつ拡大縮小する。「全体」で半端な倍率になっていても、10% 刻みの値にそろえる
const zoomStep = (dir, px, py) => setZoom(dir > 0 ? Math.floor(zoom * 10 + 1e-6) / 10 + 0.1 : Math.ceil(zoom * 10 - 1e-6) / 10 - 0.1, px, py);
$("#zoomIn").onclick = () => zoomStep(1);
$("#zoomOut").onclick = () => zoomStep(-1);
$("#zoomFit").onclick = fitZoom;

// Ctrl＋ホイール（トラックパッドのピンチ含む）でマウス位置を中心に 10% ずつ拡大縮小。
// ホイール1目盛りで1段。ピンチのような細かい動きは、ある程度たまってから1段動かす
let wheelAcc = 0, wheelAt = 0;
$("#canvas").addEventListener("wheel", ev => {
  if (!ev.ctrlKey || !flow) return;
  ev.preventDefault();
  const now = performance.now(); if (now - wheelAt > 300) wheelAcc = 0; wheelAt = now;
  wheelAcc += ev.deltaY * (ev.deltaMode === 1 ? 33 : ev.deltaMode === 2 ? 100 : 1);
  if (Math.abs(wheelAcc) < 40) return;
  const dir = wheelAcc < 0 ? 1 : -1; wheelAcc = 0;
  const rect = $("#canvas").getBoundingClientRect();
  zoomStep(dir, ev.clientX - rect.left, ev.clientY - rect.top);
}, { passive: false });
// 空いているところをドラッグして図を動かす
let pan = null, panMoved = false;
$("#canvas").addEventListener("pointerdown", ev => {
  if (ev.button !== 0 || ev.target.closest("[data-step],[data-handle],[data-end],[data-new],button")) return;
  const c = $("#canvas"); pan = { x: ev.clientX, y: ev.clientY, l: c.scrollLeft, t: c.scrollTop, id: ev.pointerId }; panMoved = false;
});
$("#canvas").addEventListener("pointermove", ev => {
  if (!pan || ev.pointerId !== pan.id) return;
  const dx = ev.clientX - pan.x, dy = ev.clientY - pan.y, c = $("#canvas");
  if (!panMoved){ if (Math.hypot(dx, dy) < 4) return; panMoved = true; c.classList.add("panning"); c.setPointerCapture(ev.pointerId); }
  c.scrollLeft = pan.l - dx; c.scrollTop = pan.t - dy;
});
const endPan = ev => { if (!pan || ev.pointerId !== pan.id) return; pan = null; $("#canvas").classList.remove("panning"); };
$("#canvas").addEventListener("pointerup", endPan);
$("#canvas").addEventListener("pointercancel", endPan);

/* ---------- editing on the diagram ---------- */
let noClickUntil = 0; // ドラッグや＋の直後に届くクリックを「選択解除」にしない
const mainSvg = () => $("#canvas .diagram svg:not(.lanes)");
const nodeEl = id => $(`#canvas [data-step="${CSS.escape(id)}"]`);
function focusNode(id){ const g = id && nodeEl(id); g && g.focus({ preventScroll: true }); }
// 画面の座標 ⇔ 図の座標（viewBox・拡大率・スクロールを含めて変換）
function toSvg(cx, cy){ const m = mainSvg()?.getScreenCTM(); if (!m) return null; const p = new DOMPoint(cx, cy).matrixTransform(m.inverse()); return [p.x, p.y]; }
function toClient(x, y){ const m = mainSvg()?.getScreenCTM(); if (!m) return null; const p = new DOMPoint(x, y).matrixTransform(m); return [p.x, p.y]; }
// 図の y 座標にあるレーン。図の外や「担当未設定」の仮レーンは null
function laneAt(y){ if (!lastL || y < 0) return null; const l = lastL.lanes[Math.floor(y / G.laneH)]; return l && !l.ghost ? l : null; }
// 列の左端の x（図の右端より先は、ふつうの列幅で並ぶものとして延ばす）と、x に一番近い列
const colLeft = c => { const X = lastL.colX, n = X.length - 1; return c <= n ? X[c] : X[n] + (c - n) * (G.nodeW + G.gap); };
function colAt(x){ let c = 0; while (Math.abs(colLeft(c + 1) + G.nodeW / 2 - x) < Math.abs(colLeft(c) + G.nodeW / 2 - x)) c++; return c; }
function showLaneHi(l){
  const i = l ? lastL.lanes.indexOf(l) : -1;
  document.querySelectorAll("#canvas .lane-hi").forEach(r => { r.setAttribute("visibility", i < 0 ? "hidden" : "visible"); if (i >= 0) r.setAttribute("y", i * G.laneH); });
}

/* その場の入力欄。anchor() は入力欄を重ねる位置（画面座標の矩形）を返し、スクロールや描き直しのたびに置き直す。
   Enter で確定、Esc で取り消し、ほかをクリックしたら確定 */
let inlineEd = null;
function inlineEdit(anchor, value, opts, done){
  if (inlineEd) inlineEd.finish(true);
  const el = document.createElement("input");
  el.className = "inline-edit"; el.value = value; el.placeholder = opts.placeholder || ""; el.setAttribute("aria-label", opts.label || "");
  const place = () => {
    const r = anchor(); if (!r) return false;
    const w = Math.max(r.width + 16, opts.minW || 170);
    Object.assign(el.style, { left: r.left + r.width / 2 - w / 2 + "px", top: r.top + r.height / 2 - 16 + "px", width: w + "px" });
    return true;
  };
  if (!place()) return;
  let fin = false;
  const finish = (ok, byKey) => {
    if (fin) return; fin = true; inlineEd = null;
    const v = el.value.trim(); el.remove();
    if (ok && v !== value.trim()) done(v);
    if (byKey && opts.focus) focusNode(opts.focus);
  };
  el.addEventListener("keydown", e => {
    if (e.isComposing || e.keyCode === 229) return; // 変換確定の Enter は無視
    if (e.key === "Enter"){ e.preventDefault(); finish(true, true); }
    else if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); finish(false, true); }
  });
  el.addEventListener("blur", () => finish(true));
  if (opts.onInput){ el.addEventListener("input", () => opts.onInput(el)); opts.onInput(el); }
  document.body.appendChild(el); el.focus(); el.select();
  inlineEd = { el, finish, place };
}
$("#canvas").addEventListener("scroll", () => { if (inlineEd && !inlineEd.place()) inlineEd.finish(true); });
window.addEventListener("resize", () => { if (inlineEd && !inlineEd.place()) inlineEd.finish(true); });

function editStepInline(id){
  const s0 = flow && flow.steps.find(x => x.id === id); if (!s0) return;
  revealStep(id);
  inlineEdit(() => nodeEl(id)?.querySelector(".shape")?.getBoundingClientRect(), s0.label,
    { placeholder: "ステップの内容（例：申請書を作成）", label: "ステップの内容", focus: id },
    v => { const s = flow.steps.find(x => x.id === id); if (s){ s.label = v; commit({ form: true }); } });
}
// 矢印の条件を編集する。pt（図の座標）を省くと、ラベルの位置か矢印の出口近くに入力欄を出す
function editEdgeInline(sid, k, pt){
  const s0 = flow && flow.steps.find(x => x.id === sid), e0 = s0?.next[k]; if (!e0) return;
  const sel = cls => $(`#canvas .${cls}[data-edge="${CSS.escape(sid)}"][data-k="${k}"]`);
  if (!pt && !sel("elabel")){
    const path = sel("ehit"); if (!path) return;
    const q = path.getPointAtLength(Math.min(40, path.getTotalLength() / 2)); pt = [q.x, q.y];
  }
  const anchor = pt ? () => { const c = toClient(...pt); return c && { left: c[0], top: c[1], width: 0, height: 0 }; } : () => sel("elabel")?.getBoundingClientRect();
  const to = flow.steps.find(x => x.id === e0.to);
  inlineEdit(anchor, e0.when, { placeholder: "条件（例：承認）", label: `「${s0.label || sid}」から「${to?.label || e0.to}」への条件`, minW: 150, onInput: markCut },
    v => { const e = flow.steps.find(x => x.id === sid)?.next[k]; if (e){ e.when = v; commit({ form: true }); } });
}
function scrollCard(id){ const el = document.querySelector(`[data-stepcard="${CSS.escape(id)}"]`); el && el.scrollIntoView({ block: "nearest" }); }
/* 次のステップを作ってつなぐ。判断・まだ次がないステップ・branch 指定のときは分岐を足し、
   それ以外は今の次のステップとの間に挟む（フォームの「この後にステップを挿入」と同じ） */
function addNext(srcId, laneId, branch){
  const s = flow.steps.find(x => x.id === srcId); if (!s) return;
  const id = newStepId(), ns = { id, type: "task", lane: laneId, label: "", note: "", issue: "", next: [] };
  if (branch || s.type === "decision" || !s.next.length) s.next.push({ to: id, when: "" });

function plus(side){

  if (i >= 0 && flow.lanes[i + 1]) addNext(s.id, flow.lanes[i + 1].id);
}
function connect(a, b){
  const s = flow.steps.find(x => x.id === a), t = flow.steps.find(x => x.id === b); if (!s || !t || a === b){ drawCanvas(); return; }
  if (s.next.some(e => e.to === b)){ toast("すでにつながっています"); drawCanvas(); return; }
  s.next.push({ to: b, when: "" }); commit({ form: true });
  toast(`「${s.label || a}」から「${t.label || b}」へつなぎました`);
  if (s.type === "decision") editEdgeInline(a, s.next.length - 1);
